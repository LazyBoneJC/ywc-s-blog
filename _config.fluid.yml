# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ywc's blog
subtitle: ""
description: ""
keywords: []
copyright: "Copyright © 2025-present, Yu-Wei Chang. All rights reserved."
author: Yu-Wei Chang
language: [en, zh-TW]
timezone: "Asia/Taipei"

# URL
url: https://lazybonejc.github.io/ywc-s-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: "mtime"

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Dark Mode - 預設使用淺色模式
dark_mode:
  enable: true
  default: light

# Deployment
deploy:
  type: git
  repo: git@github.com:LazyBoneJC/ywc-s-blog.git
  remote: origin
  branch: gh-pages

# --- 以下為主題相關設定 ---

# Slogan(打字機)
index:
  banner_img: /img/default.png
  banner_mask_alpha: 0.5
  slogan:
    enable: true
    text: "Building high-performance systems | Troubleshooting complex problems."

# Navbar
navbar:
  blog_title: ywchang's blog

# Web Analytics
web_analytics:
  enable: true
  google:
    measurement_id: G-K8ZMSZDX7L

# About Me (更新區域)
about:
  enable: true
  banner_img: /img/default.png
  banner_img_height: 60
  banner_mask_alpha: 0.6
  avatar: /img/Jacky_Avatar.jpg
  name: "Yu-Wei (Jacky) Chang"
  intro: "Backend Engineer | Cloud & Infrastructure Enthusiast"
  icons:
    - {
        class: "iconfont icon-github-fill",
        link: "https://github.com/LazyBoneJC",
        tip: "GitHub",
      }
    - {
        class: "iconfont icon-linkedin-fill",
        link: "https://www.linkedin.com/in/yu-wei-chang-6714a91a4/",
        tip: "LinkedIn",
      }
    - {
        tip: "WhatsApp",
        class: "iconfont icon-whatsapp-fill",
        link: "https://wa.me/886919922708",
      }

# Mermaid tag
mermaid:
  enable: true
  theme:
    light: default

# i18n
i18n:
  type: [post, page]
  generator: [index, archive, category, tag]

math:
  enable: true
  per_page: true
  engine: mathjax

mathjax:
  enable: false

security:
  enable_csp: false

#---------------------------
# Fluid 主題顏色設定 (專業藍紫色系)
#---------------------------
color:
  # 淺色模式
  body_bg_color: "#f8fafc"
  board_color: "#fff"
  text_color: "#1e293b"
  sec_text_color: "#64748b"
  post_text_color: "#334155"
  post_link_color: "#3b82f6" # 專業藍
  link_hover_color: "#6366f1" # 紫藍
  navbar_bg_color: "#0f172a" # 深海軍藍
  navbar_text_color: "#f1f5f9"

  # 深色模式
  body_bg_color_dark: "#0f172a"
  board_color_dark: "#1e293b"
  text_color_dark: "#e2e8f0"
  post_link_color_dark: "#60a5fa"
  link_hover_color_dark: "#818cf8"
  navbar_bg_color_dark: "#020617" # 極深藍黑

custom_css: [/css/custom.css]

# 1. 首頁 Banner
# index:
#   banner_img: /img/bitcoin.jpg
#   banner_mask_alpha: 0.3

# 2. 文章頁 Banner (所有文章進去後的頂部背景)
post:
  banner_img: /img/default.png
  banner_mask_alpha: 0.3

# 3. 存檔頁 Banner (/archives/)
archive:
  banner_img: /img/default.png
  banner_mask_alpha: 0.3

# 4. 分類頁 Banner (/categories/)
category:
  banner_img: /img/default.png
  banner_mask_alpha: 0.3

# 5. 標籤頁 Banner (/tags/)
tag:
  banner_img: /img/default.png
  banner_mask_alpha: 0.3
