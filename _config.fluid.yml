# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ywc's blog
subtitle: ""
description: ""
keywords: []
copyright: "Copyright © 2025-present, Yu-Wei Chang. All rights reserved."
author: Yu-Wei Chang
language: [zh-TW, en]
timezone: "Asia/Taipei"

# URL
url: https://lazybonejc.github.io/ywc-s-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: "mtime"

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: git
  repo: git@github.com:LazyBoneJC/ywc-s-blog.git
  remote: origin
  branch: main

# --- 以下為主題相關設定 ---

# Slogan(打字機)
index:
  banner_img: /img/bitcoin.jpg
  banner_mask_alpha: 0.5
  slogan:
    enable: true
    text: "Building secure DApps | Auditing DeFi Protocols."

# Navbar
navbar:
  blog_title: ywchang's blog

# Web Analytics
web_analytics:
  enable: true
  google:
    measurement_id: G-K8ZMSZDX7L

# About Me (更新區域)
about:
  enable: true
  banner_img: /img/bitcoin.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.6
  avatar: /img/Azuki_9080.jpg
  name: "Yu-Wei (Jacky) Chang"
  intro: "Web3 Full-Stack Engineer | Smart Contract Security Researcher"
  icons:
    - {
        class: "iconfont icon-github-fill",
        link: "https://github.com/LazyBoneJC",
        tip: "GitHub",
      }
    - {
        class: "iconfont icon-linkedin-fill",
        link: "https://www.linkedin.com/in/yu-wei-chang-6714a91a4/",
        tip: "LinkedIn",
      }
    - {
        tip: "WhatsApp",
        class: "iconfont icon-whatsapp-fill",
        link: "https://wa.me/886919922708",
      }

# Mermaid tag
mermaid:
  enable: true
  theme:
    light: default

# i18n
i18n:
  type: [post, page]
  generator: [index, archive, category, tag]

math:
  enable: true
  per_page: true
  engine: mathjax

mathjax:
  enable: false

security:
  enable_csp: false

#---------------------------
# Fluid 主題顏色設定 (Azuki 紅黑風格)
#---------------------------
color:
  # 淺色模式
  body_bg_color: "#f4f4f4"
  board_color: "#fff"
  text_color: "#1a1a1a"
  sec_text_color: "#718096"
  post_text_color: "#2c3e50"
  post_link_color: "#CC1414" # Azuki 紅
  link_hover_color: "#FF0421" # 亮紅
  navbar_bg_color: "#121212" # 導航欄變深黑
  navbar_text_color: "#fff"

  # 深色模式
  body_bg_color_dark: "#0d1117"
  board_color_dark: "#161b22"
  text_color_dark: "#c9d1d9"
  post_link_color_dark: "#FF0421"
  link_hover_color_dark: "#FF4D4D"
  navbar_bg_color_dark: "#010409" # 深色下導航欄全黑

custom_css: [/css/custom.css]

# 1. 首頁 Banner
# index:
#   banner_img: /img/bitcoin.jpg
#   banner_mask_alpha: 0.3

# 2. 文章頁 Banner (所有文章進去後的頂部背景)
post:
  banner_img: /img/bitcoin.jpg
  banner_mask_alpha: 0.3

# 3. 存檔頁 Banner (/archives/)
archive:
  banner_img: /img/bitcoin.jpg
  banner_mask_alpha: 0.3

# 4. 分類頁 Banner (/categories/)
category:
  banner_img: /img/bitcoin.jpg
  banner_mask_alpha: 0.3

# 5. 標籤頁 Banner (/tags/)
tag:
  banner_img: /img/bitcoin.jpg
  banner_mask_alpha: 0.3
