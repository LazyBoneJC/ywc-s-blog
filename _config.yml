# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ywc's blog
subtitle: ""
description: ""
keywords: []
copyright: "Copyright © 2025-present, Yu-Wei Chang. All rights reserved."
author: Yu-Wei Chang
language: [zh-TW, en]
timezone: "Asia/Taipei"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://lazybonejc.github.io/ywc-s-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:LazyBoneJC/ywc-s-blog.git
  remote: origin
  branch: main

# Slogan(打字機)
index:
  slogan:
    enable: true
    text: Documenting my journey in coding and life.

# Navbar
navbar:
  blog_title: ywchang's blog

# Web Analytics
web_analytics:
  enable: true
  google:
    measurement_id: G-K8ZMSZDX7L

# About Me
about:
  enable: true
  banner_img: /img/default.png
  banner_img_height: 60
  banner_mask_alpha: 0.3
  avatar: /img/avatar.png
  name: "Yu-Wei Chang"
  intro: "A passionate developer and lifelong learner."
  icons:
    - {
        class: "iconfont icon-github-fill",
        link: "https://github.com/LazyBoneJC",
        tip: "GitHub",
      }
    - {
        class: "iconfont icon-linkedin-fill",
        link: "https://www.linkedin.com/in/yu-wei-chang-6714a91a4/",
        tip: "LinkedIn",
      }
    - {
        tip: "WhatsApp",
        class: "iconfont icon-whatsapp-fill",
        link: "https://wa.me/886919922708",
      }

# Mermaid tag
mermaid:
  enable: true
  # Available themes: default | dark | forest | neutral
  theme:
    light: default
    # dark: dark

# i18n
i18n:
  type: [post, page]
  generator: [index, archive, category, tag]

# mathjax:
#   tags: none
#   single_dollars: true

math:
  enable: true
  per_page: true # 建議開啟，這樣只在需要渲染公式的文章中載入，加速頁面
  engine: mathjax # 或 katex

mathjax:
  enable: false
  # enable: true
  # per_page: false # 建議設為 false，讓它統一處理
  # v3: true
  # tags: all
  # cdn: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # # 【新增】MathJax 配置（用於傳遞給 MathJax.config.tex）
  # # 儘管 v3 減少了依賴，但有時仍需確保沒有 legacy code 被觸發
  # config:
  #   tex:
  #     # 這通常是預設，但確保它沒有被設為某些需要 eval 的擴展
  #     packages: ["base", "ams", "newcommand"]

# marked:
#   gfm: true
#   pedantic: false
#   sanitize: false
#   # 禁用 Smartypants，這會轉換引號和破折號，可能與 LaTeX 衝突
#   smartLists: true
#   smartypants: false

# Fluid 主題配置 (範例，實際名稱可能不同)
security:
  # 嘗試將此設為 false
  enable_csp: false
